channels:
    - conda-forge
    - bioconda
    - r
    - defaults
dependencies:
    - python==3.10
    - jupyter
    - seaborn
    - plotly
    - matplotlib
    - pandas
    - scikit-learn 
    - statsmodels 
    - papermill
    - r-base==4.4.2
    - r-dplyr==1.1.4
    - r-downlit
    - r-glue==1.8.0
    - r-xml2
    - bioconductor-biomart==2.62.0
    - bioconductor-limma==3.62.1
    - bioconductor-oligo==1.70.0
    - r-plotly 
    - r-knitr 
    - r-stringi
    - r-irkernel
    - r-r.utils # Used to decompress gzip files
    - r-statmod==1.5.0 # required for limma eBayes fit
    - r-venndiagram # Used for comparing DE sets
    - r-matrixstats==1.5.0 # Used for vector based standard deviation calculation
    - r-kernsmooth # Req. for oligo::MAplot, used in Affymetrix processing
