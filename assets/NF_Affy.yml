channels:
    - conda-forge
    - bioconda
dependencies:
    - python==3.12 # Required to work with R 4.5.3
    - jupyter
    - seaborn
    - plotly
    - matplotlib
    - pandas
    - scikit-learn 
    - statsmodels 
    - papermill
    - r-base==4.5.3
    - r-dplyr==1.2.0
    - r-downlit
    - r-glue==1.8.0
    - r-xml2
    - bioconductor-biomart==2.66.0
    - bioconductor-limma==3.66.0
    - bioconductor-oligo==1.74.0
    - r-plotly 
    - r-knitr 
    - r-irkernel
    - r-r.utils # Used to decompress gzip files
    - r-statmod==1.5.1 # required for limma eBayes fit
    - r-venndiagram # Used for comparing DE sets
    - r-matrixstats==1.5.0 # Used for vector based standard deviation calculation
    - r-kernsmooth # Req. for oligo::MAplot, used in Affymetrix processing
